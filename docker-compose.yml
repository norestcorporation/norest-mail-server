services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: norest
      POSTGRES_USER: norest
      POSTGRES_PASSWORD: norest
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - norest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norest -d norest"]
      interval: 5s
      timeout: 5s
      retries: 10

  stalwart:
    image: stalwartlabs/stalwart:v0.16
    environment:
      - STALWART_RECOVERY_ADMIN=${STALWART_RECOVERY_ADMIN}
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    ports:
      - "8081:8080"
    networks:
      - norest
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  norest-api:
    build:
      context: .
      dockerfile: docker/norest/Dockerfile
    entrypoint: ["/norest-api"]
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - norest
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  norest-worker:
    build:
      context: .
      dockerfile: docker/norest/Dockerfile
    entrypoint: ["/norest-worker"]
    env_file:
      - .env
    environment:
      - WORKER_ID=worker-1
    networks:
      - norest
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  norest-worker-2:
    build:
      context: .
      dockerfile: docker/norest/Dockerfile
    entrypoint: ["/norest-worker"]
    env_file:
      - .env
    environment:
      - WORKER_ID=worker-2
    networks:
      - norest
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  norest-worker-3:
    build:
      context: .
      dockerfile: docker/norest/Dockerfile
    entrypoint: ["/norest-worker"]
    env_file:
      - .env
    environment:
      - WORKER_ID=worker-3
    networks:
      - norest
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  stalwart-etc:
  stalwart-data:

networks:
  norest:
    driver: bridge
